# Sestaví web ve složce web/ a zveřejní ho na GitHub Pages.
#
# Spouští se:
#   - při pushnutí tagu začínajícího na "v" (např. v1.0, v2.3)
#   - ručně v záložce Actions tlačítkem "Run workflow"
#
# Jak vydat novou verzi webu:
#   git tag v1.0
#   git push origin v1.0

name: Publikovat web

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
